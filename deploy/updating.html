<!doctype html>
<!-- Shown by IIS (or another proxy) while LoanDesk itself is not answering: during an update or a restart.
     Self-contained on purpose — the app's own files are unreachable while this shows. It checks every
     5 seconds and returns to the page the person asked for as soon as LoanDesk answers again. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LoanDesk is updating</title>
<style>
  :root { --bg: #f4f6f5; --card: #fff; --text: #17201b; --muted: #5d6b63; --brand: #0f5132; --ring: #d5e3db; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111613; --card: #1a211d; --text: #e7eee9; --muted: #9aaba1; --brand: #5cc192; --ring: #2a3a31; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border-radius: 16px; padding: 32px 24px; text-align: center; box-shadow: 0 1px 3px rgb(0 0 0 / 8%); }
  .spin { width: 44px; height: 44px; margin: 0 auto 20px; border-radius: 50%; border: 4px solid var(--ring); border-top-color: var(--brand); animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 6px; color: var(--muted); }
  .brand { font-weight: 700; color: var(--brand); letter-spacing: .02em; margin-bottom: 16px; }
  .small { font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <div class="brand">LoanDesk</div>
  <div class="spin" aria-hidden="true"></div>
  <h1>Updating — back in a minute</h1>
  <p>LoanDesk is being updated or restarted. Nothing you saved is lost.</p>
  <p lang="hi">LoanDesk अपडेट हो रहा है — एक मिनट में वापस।</p>
  <p lang="bn">LoanDesk আপডেট হচ্ছে — এক মিনিটে ফিরে আসছে।</p>
  <p class="small" id="status" aria-live="polite">This page reloads by itself.</p>
</main>
<script>
  // Field officers' phones keep working offline meanwhile; this page only needs to come back by itself.
  const status = document.getElementById('status');
  let tries = 0;
  async function check() {
    tries += 1;
    try {
      const r = await fetch('/api/health', { cache: 'no-store' });
      if (r.ok && (await r.json()).ok) return location.reload();
    } catch (e) { /* still down */ }
    if (tries > 60) status.textContent = 'This is taking longer than usual. If it stays like this for more than 10 minutes, contact support.';
    setTimeout(check, 5000);
  }
  setTimeout(check, 5000);
</script>
</body>
</html>
