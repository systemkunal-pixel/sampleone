# /etc/nginx/sites-available/loan-recovery  (then: ln -s ../sites-available/loan-recovery /etc/nginx/sites-enabled/)
# Replace recovery.example.com, and get a certificate with: certbot --nginx -d recovery.example.com

server {
    listen 80;
    server_name recovery.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name recovery.example.com;

    ssl_certificate     /etc/letsencrypt/live/recovery.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recovery.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Deposit slips (≤5 MB) and loan imports (≤10 MB file, larger JSON on confirm) are sent as JSON.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # large imports
    }

    # While the app is stopped for maintenance nginx answers 502; the field app treats that as
    # "server unreachable", keeps working offline and resends queued records when it's back.
}
